name: Compilar APK de Android

# Compila el APK en la nube (no necesitas Android Studio ni el SDK en tu
# máquina). Corre en cada push y también a mano desde la pestaña Actions.
# El APK queda como "artifact" descargable al final del run.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Capacitor CLI exige Node >= 22
          cache: npm

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: SDK de Android
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK debug
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: lanaclara-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
